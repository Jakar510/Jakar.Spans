name: Publish

# Every push to master runs CI, packs Jakar.Spans and pushes it to nuget.org. A version that's already there is skipped,
# so a release is a commit that bumps <Version> in Jakar.Spans/Jakar.Spans.csproj (<.NET major>.<library major>.<library minor>).
#
# nuget.org Trusted Publishing (no stored API key): the repository needs
#   - a Trusted Publishing policy on nuget.org: owner Jakar510, repository Jakar.Spans, workflow file publish.yml;
#   - the secret NUGET_USER: the nuget.org profile name (not the email address).

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Pack and push to nuget.org
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for nuget.org Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack Jakar.Spans/Jakar.Spans.csproj -c Release -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

      - name: NuGet login (OIDC → short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes the .snupkg next to each .nupkg too.
      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
