name: CI

on:
  push:
    branches-ignore: [ master ] # master runs CI through publish.yml
  pull_request:
  workflow_call: # publish.yml runs this first

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Jakar.Spans.slnx

      - name: Build
        run: dotnet build Jakar.Spans.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Jakar.Spans.slnx -c Release --no-build --logger "trx;LogFilePrefix=${{ matrix.os }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
